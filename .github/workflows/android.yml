name: Android Build

# One entry point. Debug APKs are built on every PR/main push and manual run.
# Signed Play bundles are opt-in and require all verification jobs to pass.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_bundle:
        description: Also build a signed Play AAB after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  debug-apk:
    name: Build downloadable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/android-setup
      - name: Compile app and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --console=plain
      - name: Verify and package debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Geode-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/Geode-debug-androidTest.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set}}"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose dist/Geode-debug.apk
          python3 tools/release/check_native_alignment.py dist/Geode-debug.apk
          git rev-parse HEAD > dist/commit.txt
          (cd dist && sha256sum Geode-debug.apk Geode-debug-androidTest.apk > SHA256SUMS)
      - name: Upload downloadable APKs
        id: apk
        uses: actions/upload-artifact@v7
        with:
          name: Geode-debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - name: Link the download in the run summary
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Geode debug APK and SHA256 checksums]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Install Geode-debug.apk. The androidTest APK is for automated tests." >> "$GITHUB_STEP_SUMMARY"
          echo "Package: dev.geode.debug. Debug signed; not a Play Store release." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compile reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compile-reports-${{ github.run_number }}
          path: |
            build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 3

  quality:
    name: Kotlin tests, analysis and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/android-setup
      - name: Verify all Kotlin modules
        run: ./gradlew detekt ktlintCheck testDebugUnitTest :engine:audio-core:test :app:lintDebug --continue --stacktrace --console=plain
      - name: Show static analysis findings
        if: failure()
        run: python3 tools/android/print_quality_findings.py
      - name: Upload test and analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            engine/*/build/reports/
            engine/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 3

  native-regressions:
    name: Native and release validation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Native motion across angle wraps
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Icore -Icore/tests/include \
            core/tests/MotionFieldTest.cpp core/viz/MotionField.cpp \
            -o "$RUNNER_TEMP/motion-test"
          "$RUNNER_TEMP/motion-test"
      - name: Release validation regressions
        run: python3 -m unittest discover -s tools/release/tests -v

  emulator:
    name: Test the built APK on an emulator
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Geode-debug-${{ github.run_number }}
          path: dist
      - name: Verify downloaded checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation and UI smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/android/run_emulator_checks.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-evidence-${{ github.run_number }}
          path: app/build/reports/emulator/
          if-no-files-found: ignore
          retention-days: 3

  play-bundle:
    name: Build signed Play bundle
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_bundle == true)
    needs: [debug-apk, quality, native-regressions, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/android-setup
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICVIZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::MUSICVIZ_KEYSTORE_BASE64 secret is not set; cannot produce a signed bundle."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # The secrets keep their MUSICVIZ_ names, but app/build.gradle.kts reads
      # GEODE_ — so they are exported under the names the build looks for.
      # Mismatched, signingConfigs stays empty, bundleRelease silently produces
      # an unsigned bundle and the next step is the first thing to notice.
      - name: Build signed AAB
        env:
          GEODE_REQUIRE_RELEASE_SIGNING: "true"
          GEODE_KEYSTORE: ${{ runner.temp }}/upload.jks
          GEODE_KEYSTORE_PASSWORD: ${{ secrets.MUSICVIZ_KEYSTORE_PASSWORD }}
          GEODE_KEY_ALIAS: ${{ secrets.MUSICVIZ_KEY_ALIAS }}
          GEODE_KEY_PASSWORD: ${{ secrets.MUSICVIZ_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Confirm the bundle is signed
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          # Signature metadata alone cannot establish cryptographic integrity.
          unzip -Z1 "$aab" | grep -E 'META-INF/.*\.(RSA|EC|DSA)$' > /dev/null \
            || { echo "::error::$aab has no signing block"; exit 1; }
          LC_ALL=C jarsigner -verify "$aab" > "$RUNNER_TEMP/aab-verification.txt" 2>&1
          cat "$RUNNER_TEMP/aab-verification.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/aab-verification.txt" > /dev/null \
            || { echo "::error::Bundle signature did not verify"; exit 1; }
          sha256sum "$aab" > "$aab.sha256"

      - name: Upload AAB and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: geode-release-bundle
          # The mapping file must be uploaded to Play Console alongside the
          # bundle, otherwise crash traces stay obfuscated.
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 14

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
