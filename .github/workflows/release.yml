name: Play Store release

# Builds the signed Android App Bundle to upload to Play Console.
#
# Required repository secrets:
#   MUSICVIZ_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   MUSICVIZ_KEYSTORE_PASSWORD
#   MUSICVIZ_KEY_ALIAS
#   MUSICVIZ_KEY_PASSWORD
#
# Produce the first value with:  base64 -w0 geode-upload.jks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      # The platform matches compileSdk (37). NDK and CMake match ndkVersion
      # and externalNativeBuild.cmake.version in app/build.gradle.kts, and
      # bundleRelease builds the whole native core (libgeode.so +
      # libprojectM-4.so) from the root CMakeLists.txt with them.
      - name: Install Android SDK 37, NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set on runner}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;4.1.2"

      - name: Check static analysis on its supported runtime
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:detekt --stacktrace --no-daemon

      - name: Test release artifact validation
        run: python3 -m unittest discover -s tools/release/tests -v

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICVIZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::MUSICVIZ_KEYSTORE_BASE64 secret is not set; cannot produce a signed bundle."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Verify (ktlint, tests, lint)
        run: ./gradlew ktlintCheck testDebugUnitTest lint --stacktrace

      # The secrets keep their MUSICVIZ_ names, but app/build.gradle.kts reads
      # GEODE_ — so they are exported under the names the build looks for.
      # Mismatched, signingConfigs stays empty, bundleRelease silently produces
      # an unsigned bundle and the next step is the first thing to notice.
      - name: Build signed AAB
        env:
          GEODE_REQUIRE_RELEASE_SIGNING: "true"
          GEODE_KEYSTORE: ${{ runner.temp }}/upload.jks
          GEODE_KEYSTORE_PASSWORD: ${{ secrets.MUSICVIZ_KEYSTORE_PASSWORD }}
          GEODE_KEY_ALIAS: ${{ secrets.MUSICVIZ_KEY_ALIAS }}
          GEODE_KEY_PASSWORD: ${{ secrets.MUSICVIZ_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Confirm the bundle is signed
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          # Signature metadata alone cannot establish cryptographic integrity.
          unzip -Z1 "$aab" | grep -E 'META-INF/.*\.(RSA|EC|DSA)$' > /dev/null \
            || { echo "::error::$aab has no signing block"; exit 1; }
          LC_ALL=C jarsigner -verify "$aab" > "$RUNNER_TEMP/aab-verification.txt" 2>&1
          cat "$RUNNER_TEMP/aab-verification.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/aab-verification.txt" > /dev/null \
            || { echo "::error::Bundle signature did not verify"; exit 1; }
          sha256sum "$aab" > "$aab.sha256"

      - name: Upload AAB and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: geode-release-bundle
          # The mapping file must be uploaded to Play Console alongside the
          # bundle, otherwise crash traces stay obfuscated.
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
