name: Android build toolchain
description: Pinned Android SDK, native tools, analysis runtime and compiler
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: |
          25
          21
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - name: Install pinned Android packages
      shell: bash
      run: |
        set -euo pipefail
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set}}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses >/dev/null || true
        "$SDKMANAGER" "platform-tools" "platforms;android-37.0" \
          "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2"
        chmod +x gradlew
    - name: Rebuild AndroidX PathIterator for 16 KB devices
      shell: bash
      run: python3 tools/android/rebuild_graphics_path.py
