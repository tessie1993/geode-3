# The daemon must run on JDK 21: Detekt 1.23.8's embedded compiler cannot parse
# Java 25's runtime version. Daemon criteria override JAVA_HOME and
# org.gradle.java.home, so selecting 21 only in CI's environment is insufficient.
# Compilation still uses the separately pinned JDK 25 toolchain, emitting JVM 17.
# Install both JDKs. Download URLs are omitted because rotating vendor URLs expire.
toolchainVersion=21
